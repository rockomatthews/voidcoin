name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pip install slither-analyzer==0.11.6
      - run: solc-select install 0.8.30
      - run: solc-select use 0.8.30
      - run: forge fmt --check
      - run: forge test
      - name: Base Mainnet fork graduation regressions
        run: forge test --fork-url "$BASE_MAINNET_RPC_URL" --match-contract VOIDUniswapV3MigrationForkTest -vv
        env:
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL || 'https://mainnet.base.org' }}
      - run: npm run contracts:security
